<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#65785e" />
  <meta name="description" content="2026/08/21–08/26 東京旅行互動行程表" />
  <title>東京之旅 2026｜8/21–8/26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">TOKYO TRIP 2026</p>
      <h1>東京之旅</h1>
      <p class="hero-date">8/21（五）– 8/26（三）</p>
      <p class="hero-sub">原宿・澀谷・新宿・銀座・六本木・川越・代官山</p>
      <div class="quick-info">
        <span>✈️ EVA Air</span>
        <span>🗓️ 6 Days</span>
        <span>📍 Tokyo</span>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="trip-note" aria-label="行前提醒">
      <div>
        <span class="section-kicker">BEFORE YOU GO</span>
        <h2>行前提醒</h2>
      </div>
      <div class="note-grid">
        <div class="note-item"><span>💴</span><strong>帶日幣</strong></div>
        <div class="note-item"><span>🏨</span><strong>飯店 $21,000</strong></div>
        <div class="note-item"><span>🧴</span><strong>確認無印用品</strong><small>洗面乳・護手霜・護唇膏</small></div>
        <div class="note-item"><span>💍</span><strong>帶尾戒保證書</strong></div>
      </div>
    </section>

    <nav class="day-tabs" id="dayTabs" aria-label="選擇旅遊日期"></nav>

    <section id="dayContent" class="day-content" aria-live="polite"></section>
  </main>

  <footer>
    <p>Tokyo Trip 2026 · 點擊「Google Maps」即可開啟地點</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
